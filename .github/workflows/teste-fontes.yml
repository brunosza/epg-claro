name: Testar fontes extras
on: workflow_dispatch
jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import gzip, urllib.request, xml.etree.ElementTree as ET, collections
          urls = [
            "https://epgshare01.online/epgshare01/epg_ripper_BR1.xml.gz",
            "https://www.open-epg.com/files/brazil1.xml",
            "https://www.open-epg.com/files/brazil2.xml",
            "https://raw.githubusercontent.com/globetvapp/epg/main/Brazil/brazil1.xml",
            "https://raw.githubusercontent.com/globetvapp/epg/main/Brazil/brazil2.xml",
            "https://epg.pw/xmltv/epg_BR.xml.gz",
          ]
          alvo = ("espn", "nick", "mtv", "comedy", "paramount", "premiere", "hbo")
          for u in urls:
              try:
                  b = urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0"}), timeout=120).read()
                  if b[:2] == b"\x1f\x8b": b = gzip.decompress(b)
                  t = ET.fromstring(b)
                  n = collections.Counter(p.get("channel") for p in t.findall("programme"))
                  chans = {c.get("id"): c.findtext("display-name") for c in t.findall("channel")}
                  hit = [f"{chans[i]}[{i}]={n[i]}" for i in chans if any(a in (chans[i] or "").lower() for a in alvo) and n[i]]
                  print(f"::notice::{u} OK canais={len(chans)} progs={sum(n.values())} :: " + " ; ".join(hit)[:3500])
              except Exception as e:
                  print(f"::notice::{u} FALHOU {type(e).__name__}: {e}")
          PY
