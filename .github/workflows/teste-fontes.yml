name: Diagnostico
on: workflow_dispatch
jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import gzip, urllib.request, xml.etree.ElementTree as ET, datetime as dt, json
          agora = dt.datetime.now(dt.timezone.utc)
          br = dt.timezone(dt.timedelta(hours=-3))
          print(f"::notice::agora {agora.astimezone(br):%H:%M} BRT")
          def claro(cid):
              h = agora.astimezone(br)
              u = (f"https://programacao.claro.com.br/gatekeeper/exibicao/select?q=id_revel:(1_{cid})+AND+id_cidade:1&wt=json&rows=12"
                   f"&sort=dh_inicio+asc&fl=dh_inicio+dh_fim+titulo&fq=dh_inicio:[{h.year}-{h.month}-{h.day}T{max(h.hour-3,0):02d}:00:00Z+TO+{h.year}-{h.month}-{h.day}T23:59:00Z]")
              d = json.load(urllib.request.urlopen(u))["response"]["docs"]
              return " | ".join(f"{x['dh_inicio'][11:16]}-{x['dh_fim'][11:16]} {x['titulo']}" for x in d[:8])
          for cid, nome in ((426, "ESPN"), (2432, "ESPN 2 HD"), (1049, "ESPN HD")):
              print(f"::notice::CLARO {nome}#{cid}: {claro(cid)}")
          def fonte(url, ids):
              try:
                  b = urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"}), timeout=120).read()
                  if b[:2] == b"\x1f\x8b": b = gzip.decompress(b)
                  t = ET.fromstring(b)
                  nomes = {c.get("id"): c.findtext("display-name") for c in t.findall("channel")}
                  sel = [i for i, n in nomes.items() if any(k == (n or "").split("  ")[-1].strip().lower() for k in ids)]
                  for cid in sel:
                      linha = []
                      for p in t.findall("programme"):
                          if p.get("channel") != cid: continue
                          ini = dt.datetime.strptime(p.get("start").strip(), "%Y%m%d%H%M%S %z"); fim = dt.datetime.strptime(p.get("stop").strip(), "%Y%m%d%H%M%S %z")
                          if ini - dt.timedelta(hours=3) <= agora < fim + dt.timedelta(hours=3):
                              linha.append(f"{ini.astimezone(br):%H:%M}-{fim.astimezone(br):%H:%M} {p.findtext('title')}")
                      print(f"::notice::{url.split('/')[2]} {nomes[cid]}: " + " | ".join(linha[:8]))
              except Exception as e:
                  print(f"::notice::{url} falhou {e}")
          ids = ("espn", "espn hd", "espn 2", "espn 2 hd", "espn 4", "espn 4 hd")
          fonte("https://epgshare01.online/epgshare01/epg_ripper_BR1.xml.gz", ids)
          # sobreposições na Claro
          h = agora.astimezone(br)
          u = (f"https://programacao.claro.com.br/gatekeeper/exibicao/select?q=id_revel:(*)+AND+id_cidade:1&wt=json&rows=20000"
               f"&sort=id_canal+asc,dh_inicio+asc&fl=dh_inicio+dh_fim+id_canal&fq=dh_inicio:[{h.year}-{h.month}-{h.day}T00:00:00Z+TO+{h.year}-{h.month}-{h.day}T23:59:00Z]")
          docs = json.load(urllib.request.urlopen(u))["response"]["docs"]
          nomes = {str(x["id_canal"]): x["nome"] for x in json.load(urllib.request.urlopen("https://programacao.claro.com.br/gatekeeper/canal/select?q=id_cidade:1&rows=1000&wt=json&fl=id_canal+nome"))["response"]["docs"]}
          por = {}
          for d in docs: por.setdefault(str(d["id_canal"]), []).append((d["dh_inicio"], d["dh_fim"]))
          ruins = []
          for cid, l in por.items():
              l.sort(); ov = sum(1 for a, b in zip(l, l[1:]) if b[0] < a[1])
              if ov: ruins.append(f"{nomes.get(cid, cid)}={ov}/{len(l)}")
          print(f"::notice::SOBREPOSTOS ({len(ruins)} de {len(por)}): " + " ; ".join(ruins)[:3500])
          PY
