name: Testar fontes extras
on: workflow_dispatch
jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import gzip, urllib.request, xml.etree.ElementTree as ET, collections, datetime as dt
          agora = dt.datetime.now(dt.timezone.utc)
          urls = ["https://epgshare01.online/epgshare01/epg_ripper_BR2.xml.gz"] + [f"https://www.open-epg.com/files/brazil{i}.xml" for i in range(2, 8)] + ["https://i.mjh.nz/PlutoTV/br.xml.gz"]
          alvo = ("comedy", "mtv", "nick", "paramount", "extra")
          for u in urls:
              try:
                  b = urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0"}), timeout=120).read()
                  if b[:2] == b"\x1f\x8b": b = gzip.decompress(b)
                  t = ET.fromstring(b)
                  n = collections.Counter(p.get("channel") for p in t.findall("programme")
                                          if dt.datetime.strptime(p.get("stop"), "%Y%m%d%H%M%S %z") > agora)
                  chans = {c.get("id"): c.findtext("display-name") for c in t.findall("channel")}
                  hit = [f"{chans[i]}={n[i]}" for i in chans if any(a in (chans[i] or "").lower() for a in alvo) and n[i]]
                  print(f"::notice::{u} canais_futuros={len(n)} :: " + " ; ".join(hit)[:3000])
              except Exception as e:
                  print(f"::notice::{u} FALHOU {type(e).__name__}: {e}")
          PY
