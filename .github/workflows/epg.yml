name: Atualizar EPG

on:
  schedule:
    - cron: "0 8 * * *"  # 05:00 em Brasília
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gerar EPG
        env:
          XC_SERVIDOR: ${{ secrets.XC_SERVIDOR }}
          XC_USUARIO: ${{ secrets.XC_USUARIO }}
          XC_SENHA: ${{ secrets.XC_SENHA }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p site
          if [ -f canais_lista.json ]; then
            python3 claro_epg.py --lista canais_lista.json --dias 7 --saida site/epg_claro.xml.gz 2>&1 | tee site/status.txt
          elif [ -n "$XC_SERVIDOR" ]; then
            python3 claro_epg.py --xc --dias 7 --saida site/epg_claro.xml.gz 2>&1 | tee site/status.txt
          else
            echo "Segredos XC_* não cadastrados." | tee site/status.txt
            python3 claro_epg.py --dias 7 --saida site/epg_claro.xml.gz 2>&1 | tee -a site/status.txt
          fi
          cp relatorio_canais.txt site/ 2>/dev/null || true
          date -u "+Atualizado em %Y-%m-%d %H:%M UTC" >> site/status.txt
          while read -r linha; do echo "::notice::$linha"; done < site/status.txt
          echo '<meta charset="utf-8"><p>EPG Claro: <a href="epg_claro.xml.gz">epg_claro.xml.gz</a></p>' > site/index.html
      - name: Diagnóstico ESPN
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import gzip, collections, xml.etree.ElementTree as ET, json, urllib.request
          t = ET.fromstring(gzip.open("site/epg_claro.xml.gz").read())
          c = collections.Counter(p.get("channel") for p in t.findall("programme"))
          print("::notice::" + " | ".join(f"{k}={v}" for k, v in sorted(c.items()) if "espn" in k.lower()))
          import datetime as dt
          hoje = dt.date.today()
          for cid in (427, 2432, 2251, 1091, 1034, 426, 1049):
              u = (f"https://programacao.claro.com.br/gatekeeper/exibicao/select?q=id_revel:(1_{cid})+AND+id_cidade:1"
                   f"&wt=json&rows=3&fl=dh_inicio+titulo+id_canal&fq=dh_inicio:[{hoje.year}-{hoje.month}-{hoje.day}T00:00:00Z+TO+{hoje.year}-{hoje.month}-{hoje.day}T23:59:00Z]")
              r = json.load(urllib.request.urlopen(u))["response"]
              print(f"::notice::canal {cid}: {r['numFound']} hoje; ex: {[d.get('titulo') for d in r['docs']]}")
          PY
      - name: Guardar relatório no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -f relatorio_canais.txt 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Atualiza relatório de canais" && git push)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
